# Render Infrastructure-as-Code (IaC) Blueprint
# Deploys the Omnichannel Grocery Platform on Render 100% Free Tier (No Credit Card Required)
# Runs the full backend microservices mesh & API gateway inside a single free container

services:
  - type: web
    name: grocery-backend
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm -r run build
    startCommand: node scripts/start-backend.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
